<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Login | AI Resume Matcher</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=9">


</head>

<body>

<main class="container">

    <section class="card">

        <h1>Welcome Back 👋</h1>

        <p>
            Login to analyze your resume and find your job match.
        </p>

        <br>

        <form method="POST">

            <label>
                Email
            </label>

            <br>

            <input
                type="email"
                name="email"
                required
            >

            <br><br>

            <label>
                Password
            </label>

            <br>

            <input
                type="password"
                name="password"
                required
            >

            <br><br>

            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>

        <br>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

    </section>

</main>

</body>

</html>
